<!-- @dsCard group="Кабинет · статусы" height=60 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StatusChip</title>
<style>
  body { padding: 16px; }

</style>
</head>
<body>
<script>(function(h,m){function f(){var t=h.getAttribute('data-theme');if(m[t])h.setAttribute('data-theme',m[t]);}f();new MutationObserver(f).observe(h,{attributes:true,attributeFilter:['data-theme']});})(document.documentElement,{'pos-dark':'dark','pos-light':'light'});</script>
<div class="row wrap">
  <span class="status-chip" data-status="OPENING">Включается</span>
  <span class="status-chip" data-status="ACTIVE">Идёт</span>
  <span class="status-chip" data-status="PAUSED">На паузе</span>
  <span class="status-chip" data-status="AWAITING_PAYMENT">Ждёт оплаты</span>
  <span class="status-chip" data-status="CLOSED">Оплачено</span>
  <span class="status-chip" data-status="CANCELLED">Отменено</span>
  <span class="status-chip" data-status="FAILED">Не началась</span>
</div>
</body>
</html>
