<!doctype html>
<html lang="ru" data-surface="pos">
<head>
<meta charset="utf-8">
<title>PosSegmented</title>
<style>
  body { padding: 16px; }

</style>
</head>
<body>
<script>(function(h,m){h.setAttribute('data-surface','pos');function f(){var t=h.getAttribute('data-theme');if(m[t])h.setAttribute('data-theme',m[t]);}f();new MutationObserver(f).observe(h,{attributes:true,attributeFilter:['data-theme']});})(document.documentElement,{dark:'pos-dark',light:'pos-light'});</script>
<div id="root" style="display:grid;gap:12px"></div>
<script>
var T = window.TS, h = React.createElement;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Demo() {
  var s = React.useState('HERE');
  return h(React.Fragment, null,
    h(T.PosSegmented, { label: 'Где гость', value: s[0], onChange: s[1], options: [{ value: 'HERE', label: 'Здесь' }, { value: 'TAKEAWAY', label: 'С собой' }] }),
    h(T.PosSegmented, { label: 'Где гость', value: 'TAKEAWAY', onChange: function () {}, disabled: true, options: [{ value: 'HERE', label: 'Здесь' }, { value: 'TAKEAWAY', label: 'С собой' }] }));
}
mount(h(Demo));
</script>
</body>
</html>
