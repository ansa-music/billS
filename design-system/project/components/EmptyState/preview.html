<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>EmptyState</title>
<style>
  body { padding: 16px; }

</style>
</head>
<body>
<script>(function(h,m){function f(){var t=h.getAttribute('data-theme');if(m[t])h.setAttribute('data-theme',m[t]);}f();new MutationObserver(f).observe(h,{attributes:true,attributeFilter:['data-theme']});})(document.documentElement,{'pos-dark':'dark','pos-light':'light'});</script>
<div style="display:grid;gap:16px">
  <div class="empty-state">
    <p class="muted">Заведений пока нет.</p>
    <a class="btn btn-primary" href="#">Добавьте первое заведение</a>
  </div>
  <p class="empty">Везде спокойно — открытых тревог нет</p>
</div>
</body>
</html>
