<!doctype html>
<html lang="ru" data-surface="pos">
<head>
<meta charset="utf-8">
<title>PosAmount</title>
<style>
  body { padding: 16px; }
  .wrap { display: grid; gap: 6px; }
</style>
</head>
<body>
<script>(function(h,m){h.setAttribute('data-surface','pos');function f(){var t=h.getAttribute('data-theme');if(m[t])h.setAttribute('data-theme',m[t]);}f();new MutationObserver(f).observe(h,{attributes:true,attributeFilter:['data-theme']});})(document.documentElement,{dark:'pos-dark',light:'pos-light'});</script>
<div class="wrap">
  <p class="timer" aria-label="Сыграно">0:42:10</p>
  <p class="amount">1 400 ₸<span class="amount-note">минимум 60 мин</span></p>
</div>
</body>
</html>
