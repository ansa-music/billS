<!doctype html>
<html lang="ru" data-surface="pos" data-business="cafe">
<head>

<script>(function(h,m){h.setAttribute('data-surface','pos');h.setAttribute('data-business','cafe');function f(){var t=h.getAttribute('data-theme');if(m[t])h.setAttribute('data-theme',m[t]);}f();new MutationObserver(f).observe(h,{attributes:true,attributeFilter:['data-theme']});})(document.documentElement,{dark:'pos-dark',light:'pos-light'});</script>
<section class="page kds" style="--fill-h: 560px;"><header class="kds-bar"><div class="kds-load" aria-live="polite"><strong class="kds-load-num">3</strong><span class="kds-load-label">в работе</span></div><div class="kds-allday" aria-label="Всего в работе"><span class="kds-allday-title">Всего в работе</span><ul class="kds-allday-list"><li class="kds-allday-item"><strong class="kds-allday-qty">1</strong> Американо</li><li class="kds-allday-item"><strong class="kds-allday-qty">1</strong> Латте<span class="kds-attn">Овсяное 1</span></li></ul></div><div class="kds-tools"><button type="button" class="kds-tool" disabled="" aria-label="Выданные: 0" title="Выданные за последние 15 минут: вернуть в «Готовы»"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg><span class="kds-tool-label">Выданные</span></button><button type="button" class="kds-tool" aria-label="Стоп-лист" title="Стоп-лист: что закончилось"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6h12v12H6z"></path></svg><span class="kds-tool-label">Стоп-лист</span></button><a class="kds-tool" href="#" aria-label="Экран заказов для гостей" title="Экран заказов для гостей"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h18v12H3zM8 21h8M12 17v4"></path></svg><span class="kds-tool-label">Экран гостей</span></a><button type="button" class="kds-tool" aria-pressed="true" aria-label="Звук нового заказа" title="Звук нового заказа включён — выключить"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg><span class="kds-tool-label">Звук</span></button><button type="button" class="kds-tool kds-tool-fs" title="На весь экран" aria-label="На весь экран"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button></div></header>
<div class="kds-tabs" role="tablist" aria-label="Этапы"><button type="button" role="tab" class="kds-tab" data-stage="NEW" aria-selected="true">Новые<span class="kds-tab-count">1</span></button><button type="button" role="tab" class="kds-tab" data-stage="PREPARING" aria-selected="false">Готовятся<span class="kds-tab-count">1</span></button><button type="button" role="tab" class="kds-tab" data-stage="READY" aria-selected="false">Готовы<span class="kds-tab-count">1</span></button></div>
<div class="kds-board">
<section class="kds-col" data-stage="NEW" data-active="true"><header class="kds-col-head"><h2>Новые</h2><span class="kds-col-count">1</span></header><ul class="kds-cards"><li class="kds-card" data-stage="NEW" data-age="ok"><div class="kds-card-head"><span class="kds-num">3</span><span class="kds-service" data-service="TAKEAWAY">С собой</span><span class="kds-timer" title="С момента заказа"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 7v5l3 3M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>0:20</span></div><ul class="kds-items"><li class="kds-item"><span class="kds-qty">1×</span><span class="kds-item-text"><strong class="kds-item-name">Американо</strong><span class="kds-opts"><span class="kds-opt">S</span></span></span></li></ul><div class="kds-actions"><button type="button" class="kds-next" data-to="PREPARING">Начать</button></div></li></ul></section>
<section class="kds-col" data-stage="PREPARING"><header class="kds-col-head"><h2>Готовятся</h2><span class="kds-col-count">1</span></header><ul class="kds-cards"><li class="kds-card" data-stage="PREPARING" data-age="ok"><div class="kds-card-head"><span class="kds-num">2</span><span class="kds-service" data-service="TAKEAWAY">С собой</span><span class="kds-timer" title="С момента заказа"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 7v5l3 3M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>0:31</span></div><ul class="kds-items"><li class="kds-item"><span class="kds-qty">1×</span><span class="kds-item-text"><strong class="kds-item-name">Латте</strong><span class="kds-opts"><span class="kds-opt">S</span><span class="kds-opt" data-attn="true">Овсяное</span></span></span></li></ul><div class="kds-actions"><button type="button" class="kds-back" aria-label="Назад в «Новые»" title="Назад в «Новые»"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"></path></svg></button><button type="button" class="kds-next" data-to="READY">Готово</button></div></li></ul></section>
<section class="kds-col" data-stage="READY"><header class="kds-col-head"><h2>Готовы</h2><span class="kds-col-count">1</span></header><ul class="kds-cards"><li class="kds-card" data-stage="READY" data-age="ready"><div class="kds-card-head"><span class="kds-num">1</span><span class="kds-service" data-service="TAKEAWAY">С собой</span><span class="kds-timer" title="Ждёт гостя с момента «Готово»"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 7v5l3 3M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>0:07</span></div><ul class="kds-items"><li class="kds-item" data-many="true"><span class="kds-qty">2×</span><span class="kds-item-text"><strong class="kds-item-name">Капучино</strong><span class="kds-opts"><span class="kds-opt">S</span></span></span></li><li class="kds-item"><span class="kds-qty">1×</span><span class="kds-item-text"><strong class="kds-item-name">Круассан</strong></span></li></ul><p class="kds-summary">Капучино ×2, Круассан</p><div class="kds-actions"><button type="button" class="kds-back" aria-label="Назад в «Готовятся»" title="Назад в «Готовятся»"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"></path></svg></button><button type="button" class="kds-next" data-to="ISSUED">Выдан</button></div></li></ul></section>
</div>
<div class="kds-undo" role="status"><span class="kds-undo-text">Заказ <strong>2</strong> → «Готовится»</span><button type="button" class="kds-undo-btn"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg> Вернуть</button><button type="button" class="kds-undo-close" aria-label="Скрыть"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
</section>
</body>
</html>
