# TS «облачная касса»: the HUB in a Worker, one SQLite Durable Object per café (README.md, docs/CLOUD_KASSA_RU.md).
# Local: `npm run dev -w @bills/cloud-hub` (wrangler dev, Miniflare keeps the data in .wrangler/).
# Deploy: the «Cloud cash desk» step of .github/workflows/deploy.yml (Worker ts-kassa, secret ADMIN_TOKEN), nothing by hand.
name = "ts-kassa"
main = "dist/worker.js"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "node build.mjs"
watch_dir = ["src", "../hub/src", "../../packages/domain/src", "../web/src/demo-hub"]

# The TS screens built for the cloud (scripts/build-web.mjs) on the same origin: no CORS, no preflights,
# and static asset requests are free. Only café API and admin calls run the Worker.
[assets]
directory = "./web-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/c/*", "/admin", "/admin/*"]

[[durable_objects.bindings]]
name = "CAFE"
class_name = "CafeHub"

# One object for the admin API's Idempotency-Keys (src/registry.ts): a retried import never makes a second café.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "AdminRegistry"

# SQLite-backed Durable Objects (the only kind on the Workers Free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CafeHub", "AdminRegistry"]

# A café's code is its address (/c/<code>/…): request logs would keep it. No Workers Logs, no traces.
[observability]
enabled = false

[vars]
# Screens on another origin allowed to call the café API (comma-separated, `https://*.pages.dev`). Empty: the
# screens come from this Worker itself (same origin), and no other site may call a café from a browser.
ALLOWED_ORIGINS = ""
