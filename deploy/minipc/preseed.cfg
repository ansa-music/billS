#### deploy/minipc/preseed.cfg — ответы установщику Debian для образа «TS для мини-ПК».
#
# build-iso.sh кладёт этот файл в корень initrd установщика (/preseed.cfg) — так установщик
# читает его раньше всех вопросов. Пункт меню «Установить TS» загружает именно этот initrd.
#
# ВНИМАНИЕ: установка СТИРАЕТ выбранный диск без вопросов. Диск выбирает
# /ts-minipc/pick-disk.sh (partman/early_command): самый большой внутренний диск, никогда не
# флешку установки и не USB; если на дисках уже стоит TS — установка останавливается.
#
# @TS_USER_PASSWORD_HASH@ build-iso.sh заменяет хэшем случайного одноразового пароля: его никто
# не знает, а настоящий пароль пользователя ts задаёт первая загрузка (ts-firstboot.service).

### Язык, страна, клавиатура
# Установщик работает по-английски: русский он показывает только в графическом режиме, а в
# текстовом (экран без кадрового буфера, COM-порт) язык ru отбрасывается и установщик ОСТАНАВЛИВАЕТСЯ
# на вопросе «Select a language». Русская локаль ставится в систему (supported-locales), а
# late.sh делает её основной — экран мини-ПК остаётся русским.
d-i debian-installer/language string en
d-i debian-installer/country string KZ
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/languagelist select en
d-i localechooser/supported-locales multiselect en_US.UTF-8, ru_RU.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/toggle select No toggling

### Сеть: проводной порт, DHCP. Без сети установщик повторяет попытки, пока кабель не подключат.
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 30
d-i netcfg/dhcpv6_timeout string 3
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Retry network autoconfiguration
d-i netcfg/get_hostname string ts-hub
d-i netcfg/get_domain string
d-i netcfg/hostname string ts-hub
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Зеркало Debian
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Пользователи: вход root закрыт, администратор — ts (sudo). Пароль задаст первая загрузка.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string TS
d-i passwd/username string ts
d-i passwd/user-password-crypted password @TS_USER_PASSWORD_HASH@
d-i user-setup/encrypt-home boolean false

### Время
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Almaty
d-i clock-setup/ntp boolean true

### Разметка: весь выбранный диск, без LVM. Корень ext4 с меткой TS-HUB (по ней видно, что TS стоит).
d-i partman/early_command string sh /ts-minipc/pick-disk.sh
d-i partman-auto/method string regular
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-auto/expert_recipe string                         \
      ts-hub ::                                               \
              538 538 1075 free                               \
                      $iflabel{ gpt }                         \
                      $reusemethod{ }                         \
                      method{ efi }                           \
                      format{ }                               \
              .                                               \
              8000 10000 -1 ext4                              \
                      $primary{ }                             \
                      $bootable{ }                            \
                      method{ format }                        \
                      format{ }                               \
                      use_filesystem{ }                       \
                      filesystem{ ext4 }                      \
                      label{ TS-HUB }                         \
                      mountpoint{ / }                         \
              .                                               \
              2048 2048 4096 linux-swap                       \
                      method{ swap }                          \
                      format{ }                               \
              .
d-i partman-auto/choose_recipe select ts-hub
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid

### Источники пакетов: без флешки, с обновлениями безопасности
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect security, updates

### Пакеты: минимальная система + то, что нужно TS и экрану мини-ПК.
# Автоматические обновления безопасности — unattended-upgrades.
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string sudo curl ca-certificates git gzip xz-utils qrencode console-setup kbd locales systemd-timesyncd unattended-upgrades apt-listchanges iproute2 iputils-ping less nano
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades
d-i pkgsel/updatedb boolean false
popularity-contest popularity-contest/participate boolean false

### Загрузчик на тот же диск; копия в EFI/BOOT/BOOTX64.EFI — для мини-ПК, которые «забывают» пункты загрузки.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/force-efi-extra-removable boolean true

### Последний шаг: файлы TS и первая загрузка (late.sh), затем перезагрузка без вопросов.
d-i preseed/late_command string sh /ts-minipc/late.sh
d-i cdrom-detect/eject boolean false
d-i finish-install/reboot_in_progress note
