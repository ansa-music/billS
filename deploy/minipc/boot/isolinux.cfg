# TS: menyu fleshki "TS dlya mini-PK" (BIOS / Legacy). Sobiraet deploy/minipc/build-iso.sh.
# Menyu BIOS ne umeet kirillicu, poetomu tekst latinicey. Prezhnee menyu Debian: isolinux-debian.cfg.
path
default vesamenu.c32
prompt 0
timeout @TIMEOUT_DS@
menu title TS @TS_VERSION@ - avtomaticheskaya ustanovka
menu color sel 1;37;41 #ffffffff #ffc00000 std
menu color title 1;37;40 #ffffffff #00000000 std
menu tabmsg ENTER - start

label ts
  menu label ^Install TS - ERASES ALL DATA ON THE DISK
  menu default
  kernel /install.amd/vmlinuz
  append vga=788 initrd=/install.amd/ts-initrd.gz auto=true priority=critical locale=en_US.UTF-8 keymap=us --- quiet
  text help
   Ustanovit TS. SOTRET VSE DANNYE NA DISKE mini-PK!
   Esli TS uzhe ustanovlen, ustanovka ostanovitsya i nichego ne sotret.
  endtext

label ts-reinstall
  menu label ^Reinstall TS over existing TS (ERASES club database)
  kernel /install.amd/vmlinuz
  append vga=788 initrd=/install.amd/ts-initrd.gz auto=true priority=critical locale=en_US.UTF-8 keymap=us ts_reinstall=1 --- quiet
  text help
   Pereustanovit TS zanovo: sotret ves disk, vklyuchaya bazu kluba.
  endtext

label debian
  menu label ^Debian installer (manual, for support)
  config /isolinux/isolinux-debian.cfg /isolinux/
