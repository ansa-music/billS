# TS: меню флешки «TS для мини-ПК» (UEFI). Собирает deploy/minipc/build-iso.sh из шаблона,
# прежнее меню Debian лежит рядом: /boot/grub/grub-debian.cfg.
set default=ts_install
set timeout=@TIMEOUT@
set timeout_style=menu

if loadfont /boot/grub/ts-unicode.pf2 ; then
  set ts_font=1
elif loadfont $prefix/font.pf2 ; then
  set ts_font=1
fi
if [ x$ts_font = x1 ] ; then
  set gfxmode=1024x768,800x600,auto
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi
set color_normal=light-gray/black
set color_highlight=white/red
set menu_color_normal=light-gray/black
set menu_color_highlight=white/red

# Защита: если на дисках этого компьютера уже стоит TS — по умолчанию загружаем его, а не стираем.
# (Флешка, забытая в мини-ПК, после отключения света ничего не сотрёт.)
set ts_installed=
search --no-floppy --file --set=ts_installed /etc/ts-minipc/image-info
if [ -z "$ts_installed" ] ; then
  search --no-floppy --file --set=ts_installed /etc/bills/hub.env
fi

if [ -n "$ts_installed" ] ; then
  set default=ts_boot_disk
  set timeout=5
  menuentry 'Запустить установленный TS (флешку можно вынуть)' --id ts_boot_disk {
    set root=$ts_installed
    if [ -f /boot/grub/grub.cfg ] ; then
      configfile /boot/grub/grub.cfg
    fi
    exit
  }
  menuentry 'Переустановить TS заново (СОТРЁТ ВЕСЬ ДИСК, ВКЛЮЧАЯ БАЗУ КЛУБА)' --id ts_reinstall {
    set background_color=black
    linux /install.amd/vmlinuz auto=true priority=critical ts_reinstall=1 --- quiet
    initrd /install.amd/ts-initrd.gz
  }
else
  menuentry 'Установить TS (СОТРЁТ ВСЕ ДАННЫЕ НА ДИСКЕ)' --id ts_install {
    set background_color=black
    linux /install.amd/vmlinuz auto=true priority=critical --- quiet
    initrd /install.amd/ts-initrd.gz
  }
fi

menuentry 'Ничего не устанавливать: загрузиться с жёсткого диска' {
  exit
}

submenu 'Для техподдержки: обычный установщик Debian (вручную, без TS)' {
  configfile /boot/grub/grub-debian.cfg
}
