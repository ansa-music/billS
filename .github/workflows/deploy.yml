# Публичный TS: бэкенд в Supabase, сайты на Cloudflare Pages (docs/PUBLIC_DEPLOY_RU.md).
#
# - push в main: проверки → миграции и Edge Functions в Supabase → сборка → выкладка двух сайтов
#   (кабинет владельца и демо экрана клуба) на Cloudflare Pages;
# - pull request: проверки, сборка и preview-копии сайтов на Cloudflare Pages, ссылки — комментарием в PR.
#   База и функции Supabase из PR не меняются.
#
# Каждая часть включается своими секретами; без них шаг пропускается (проверки и сборка идут всегда):
#   Supabase:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD (+ переменная SUPABASE_PROJECT_REF)
#               (+ для push: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, NOTIFY_SECRET)
#               (+ Telegram-бот: TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, переменная TELEGRAM_BOT_USERNAME)
#   Cloudflare: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Несекретные значения — переменные или секреты, подойдёт любое (Settings → Secrets and variables → Actions):
#   SUPABASE_PROJECT_REF — ID проекта Supabase (из адреса https://<ID>.supabase.co);
#   SUPABASE_ANON_KEY — публичный anon/publishable ключ проекта (попадает в сайт, это не секрет);
#   VAPID_PUBLIC_KEY  — публичный ключ Web Push (тоже не секрет);
#   CF_PAGES_CABINET / CF_PAGES_DEMO — имена проектов Pages, если не ts-cabinet / ts-demo;
#   TS_OWNER_EMAILS — e-mail владельцев платформы через запятую (учётки Supabase Auth, см. docs);
#   TS_CABINET_URL — адрес кабинета для ссылок в письмах (приглашение управляющего, смена пароля)
#                    и в push; по умолчанию https://ts-cabinet.pages.dev. С SUPABASE_ACCESS_TOKEN он же
#                    ставится в Supabase → Authentication → URL Configuration (Site URL и Redirect URLs);
#   TS_DEMO_CLOUD=1 — завести демо-клиента «Демо-сеть»; TS_DEMO_MANAGER_EMAIL — его управляющий
#                     (по умолчанию demo-manager@ts.demo).
# Секреты лицензий (необязательно): LICENSE_SIGNING_KEY, LICENSE_KEY_ID — без них лицензии
#   подписываются DEV-ключом (их принимает только HUB с HUB_LICENSE_DEV_KEY=1).
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PAGES_CABINET: ${{ vars.CF_PAGES_CABINET || 'ts-cabinet' }}
  TS_CABINET_URL: ${{ vars.TS_CABINET_URL || secrets.TS_CABINET_URL || 'https://ts-cabinet.pages.dev' }}
  CF_PAGES_DEMO: ${{ vars.CF_PAGES_DEMO || 'ts-demo' }}
  CF_PAGES_TRIAL: ${{ vars.CF_PAGES_TRIAL || 'ts-kofe' }}
  # The first trial address; its Pages project is deleted once the new one is live.
  CF_PAGES_TRIAL_OLD: ts-trial

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ (vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF) }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # ── Supabase: база и функции (только main) ──────────────────────────────
      - name: Setup Supabase CLI
        if: env.LIVE == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase migrations
        if: env.LIVE == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      # Первые владельцы платформы и демо-клиент: SQL через Management API (как SQL Editor, роль postgres).
      - name: Supabase platform owners and demo cloud
        if: env.LIVE == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' && env.SUPABASE_DB_PASSWORD != ''
        env:
          TS_OWNER_EMAILS: ${{ (vars.TS_OWNER_EMAILS || secrets.TS_OWNER_EMAILS) }}
          TS_DEMO_CLOUD: ${{ (vars.TS_DEMO_CLOUD || secrets.TS_DEMO_CLOUD) }}
          TS_DEMO_MANAGER_EMAIL: ${{ (vars.TS_DEMO_MANAGER_EMAIL || secrets.TS_DEMO_MANAGER_EMAIL) }}
        run: |
          sql() {
            local body code
            body=$(jq -n --arg q "$1" '{query: $q}')
            code=$(curl -sS -o /tmp/ts-sql.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::SQL: HTTP $code $(cat /tmp/ts-sql.json)"; return 1; fi
          }
          # Строковый литерал SQL: одинарные кавычки удваиваются.
          lit() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"; }
          IFS=',' read -ra emails <<< "${TS_OWNER_EMAILS:-}"
          for raw in "${emails[@]}"; do
            email=$(printf '%s' "$raw" | tr -d '[:space:]')
            [ -z "$email" ] && continue
            sql "select public.ts_make_platform_owner($(lit "$email")) as id"
            echo "владелец платформы: $email"
          done
          if [ "${TS_DEMO_CLOUD:-}" = "1" ]; then
            sql "select (public.ts_seed_demo_cloud($(lit "${TS_DEMO_MANAGER_EMAIL:-demo-manager@ts.demo}")) - 'managerKey' - 'hubs') as r"
            # Ключи (MGR-…, ключи HUB) не печатаются: журнал Actions может быть публичным.
            echo "демо-клиент: $(jq -c '.[0].r' /tmp/ts-sql.json)"
          fi

      - name: Supabase function secrets
        if: env.LIVE == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          LICENSE_SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
          LICENSE_KEY_ID: ${{ (vars.LICENSE_KEY_ID || secrets.LICENSE_KEY_ID) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ (vars.TELEGRAM_BOT_USERNAME || secrets.TELEGRAM_BOT_USERNAME) }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          args=()
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT NOTIFY_SECRET TS_CABINET_URL LICENSE_SIGNING_KEY LICENSE_KEY_ID TELEGRAM_BOT_TOKEN TELEGRAM_BOT_USERNAME TELEGRAM_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then args+=("$name=${!name}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"; else echo "секретов для функций нет — push выключен"; fi

      # Ссылки из писем Supabase (приглашение управляющего, смена пароля, вход по ссылке) ведут в кабинет
      # только если адрес разрешён: Site URL = кабинет, Redirect URLs += кабинет/** и копия на GitHub Pages.
      # Management API: GET /config/auth → дописываем свои адреса к уже разрешённым → PATCH.
      - name: Supabase Auth URL configuration
        if: env.LIVE == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        env:
          GH_PAGES_CABINET: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cabinet
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          cabinet="${TS_CABINET_URL%/}"
          code=$(curl -sS -o /tmp/ts-auth.json -w '%{http_code}' "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::warning::Auth config: HTTP $code — задайте URL вручную (docs/PUBLIC_DEPLOY_RU.md)"; exit 0; fi
          body=$(jq -c --arg site "$cabinet" --arg add "$cabinet/**,$GH_PAGES_CABINET/**" '
            ((.uri_allow_list // "") | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != ""))) as $have
            | {site_url: $site, uri_allow_list: (($have + ($add | split(","))) | unique | join(","))}' /tmp/ts-auth.json)
          code=$(curl -sS -o /tmp/ts-auth-patch.json -w '%{http_code}' -X PATCH "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::warning::Auth config: HTTP $code $(cat /tmp/ts-auth-patch.json)"; exit 0; fi
          echo "Supabase Auth: $(jq -c '{site_url, uri_allow_list}' /tmp/ts-auth-patch.json)"

      - name: Supabase Edge Functions
        if: env.LIVE == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          node scripts/bundle-edge.mjs
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
          # Любой запрос к функциям подписывает лицензии, записанные SQL без подписи (ts_seed_demo_cloud); ответ 401 — нормально.
          curl -sS -o /dev/null -w 'platform: HTTP %{http_code}\n' "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/platform/platform/me" || true

      # «TS в Telegram»: Telegram шлёт сообщения боту в функцию `telegram` с секретом в заголовке.
      # Токен не печатается: ответ Telegram сохраняется в файл, в журнал идут только ok и описание.
      - name: Telegram webhook
        if: env.LIVE == 'true' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then echo "Telegram-бот не настроен — пропускаю"; exit 0; fi
          curl -sS -o /tmp/ts-tg.json "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/telegram" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' || true
          echo "Telegram webhook: $(jq -c '{ok, description}' /tmp/ts-tg.json 2>/dev/null || echo 'нет ответа')"

      # ── Сайты ──────────────────────────────────────────────────────────────
      - name: Cloudflare Pages projects
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && (env.LIVE == 'true' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          for p in "$CF_PAGES_CABINET" "$CF_PAGES_DEMO" "$CF_PAGES_TRIAL"; do
            if npx --yes wrangler@4 pages project list 2>&1 | grep -qw "$p"; then echo "проект Pages $p уже есть"; else npx --yes wrangler@4 pages project create "$p" --production-branch=main; fi
          done
          # Real address of the trial site (pages.dev may add a suffix when the name is taken):
          # the cabinet links to it from «Пробные версии».
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_TRIAL" | jq -r '.result.subdomain // empty' || true)
          if [ -n "$sub" ]; then echo "VITE_TRIAL_URL=https://$sub" >> "$GITHUB_ENV"; echo "пробная версия: https://$sub"; fi
          if [ "$LIVE" = "true" ] && [ "$CF_PAGES_TRIAL_OLD" != "$CF_PAGES_TRIAL" ] && npx --yes wrangler@4 pages project list 2>&1 | grep -qw "$CF_PAGES_TRIAL_OLD"; then
            npx --yes wrangler@4 pages project delete "$CF_PAGES_TRIAL_OLD" --yes && echo "старый адрес $CF_PAGES_TRIAL_OLD удалён"
          fi

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ (vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF) != '' && format('https://{0}.supabase.co', (vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF)) || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ (vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY) }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}
        run: |
          npm run build -w @bills/cloud-web
          VITE_DEMO_LOCAL=1 npm run build -w @bills/web
          # Two-week browser trial for a coffee shop: the same in-page HUB, the person's own data.
          VITE_DEMO_LOCAL=1 VITE_TRIAL=1 npm run build -w @bills/web -- --outDir dist-trial

      - name: Deploy cabinet
        id: cabinet
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && (env.LIVE == 'true' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # From apps/cloud-web so wrangler picks up functions/ (short links /download/<kind>).
          workingDirectory: apps/cloud-web
          command: pages deploy dist --project-name=${{ env.CF_PAGES_CABINET }} --branch=${{ env.LIVE == 'true' && 'main' || github.head_ref }} --commit-dirty=true

      - name: Deploy demo
        id: demo
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && (env.LIVE == 'true' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ env.CF_PAGES_DEMO }} --branch=${{ env.LIVE == 'true' && 'main' || github.head_ref }} --commit-dirty=true

      - name: Deploy trial
        id: trial
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && (env.LIVE == 'true' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist-trial --project-name=${{ env.CF_PAGES_TRIAL }} --branch=${{ env.LIVE == 'true' && 'main' || github.head_ref }} --commit-dirty=true

      - name: Preview links in the PR
        if: github.event_name == 'pull_request' && steps.cabinet.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          CABINET_URL: ${{ steps.cabinet.outputs.deployment-url }}
          DEMO_URL: ${{ steps.demo.outputs.deployment-url }}
          TRIAL_URL: ${{ steps.trial.outputs.deployment-url }}
        with:
          script: |
            const body = [
              '**Preview TS (Cloudflare Pages)**',
              `- кабинет владельца: ${process.env.CABINET_URL}`,
              `- демо экрана клуба: ${process.env.DEMO_URL}`,
              `- пробная версия кофейни: ${process.env.TRIAL_URL}`,
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Nothing to deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Нет секретов Cloudflare — сайты собраны, но не выложены. Запасной вариант без регистрации — workflow pages (GitHub Pages)."
