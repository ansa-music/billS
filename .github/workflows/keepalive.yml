name: Keep Supabase awake

# A free Supabase project is paused after 7 days without database activity. Every 3 days
# this reads one table: straight from the database when SUPABASE_DB_URL is set (works even
# while Render sleeps), otherwise through the cloud (wakes it, ~1 minute).
# GitHub turns scheduled workflows off after 60 days without commits — re-enable it in Actions.
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUD_URL: ${{ vars.TS_CLOUD_URL || 'https://ts-cloud.onrender.com' }}
    steps:
      - name: Query the database
        if: env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM companies;"

      - name: Query through the cloud
        if: env.SUPABASE_DB_URL == ''
        run: curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$CLOUD_URL/api/health?db=1"
