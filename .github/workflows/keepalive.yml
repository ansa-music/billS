# Бесплатный проект Supabase ставится на паузу, если к нему 7 дней никто не обращался.
# Раз в 3 дня этот workflow делает запрос к API проекта (PostgREST) с публичным anon-ключом.
# Нужны переменные репозитория SUPABASE_PROJECT_REF и SUPABASE_ANON_KEY; без них шаг пропускается.
# GitHub выключает расписание, если в репозитории 60 дней не было коммитов, — включите его во вкладке Actions.
name: keepalive

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      REF: ${{ (vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF) }}
      ANON: ${{ (vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY) }}
    steps:
      - name: Ping Supabase
        if: env.REF != '' && env.ANON != ''
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: $ANON" -H "content-type: application/json" \
            -X POST "https://$REF.supabase.co/rest/v1/rpc/ts_ping" -d '{}'
