# HUB на Windows как служба (deploy/windows): единственная проверка этого набора скриптов на настоящем
# Windows. Синтаксис всех скриптов PowerShell 5.1, затем install.ps1 на чистом windows-раннере ставит
# код из этого коммита (Node, git, npm ci, задача Планировщика от SYSTEM), и HUB должен ответить на
# /api/health. Нужен интернет — на раннере он есть.
#
# - pull request и push в main, где меняется deploy/windows/** или этот файл;
# - ручной запуск (Actions → windows-hub → Run workflow).
name: windows-hub

on:
  push:
    branches: [main]
    paths:
      - 'deploy/windows/**'
      - '.github/workflows/windows-hub.yml'
  pull_request:
    paths:
      - 'deploy/windows/**'
      - '.github/workflows/windows-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # install.ps1 ставит код из этого коммита (git clone + npm ci) и задачу Планировщика от SYSTEM.
  windows-service:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Синтаксис скриптов PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem deploy\windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=deploy/windows/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: install.ps1 (служба HUB)
        shell: powershell
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\install.ps1 -Ref $env:REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $h = Invoke-RestMethod http://127.0.0.1:4310/api/health -UseBasicParsing
          if (-not $h.ok) { exit 1 }
          Write-Host "Служба HUB работает: git $($h.gitSha), схема $($h.schemaVersion)"
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\bills\bin\hub.ps1 status

      - name: Журналы установки
        if: always()
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem C:\bills\logs -Filter *.log -ErrorAction SilentlyContinue) {
            Write-Host "--- $($f.Name)"; Get-Content -LiteralPath $f.FullName -Tail 80
          }
