# Запасной хостинг без регистрации: GitHub Pages (docs/PUBLIC_DEPLOY_RU.md, «Вариант Б»).
#   https://<владелец>.github.io/<репозиторий>/cabinet/ — кабинет владельца
#   https://<владелец>.github.io/<репозиторий>/demo/    — демо экрана клуба
#   https://<владелец>.github.io/<репозиторий>/kofe/    — пробная версия кофейни на 14 дней
# Включение: Settings → Pages → Source: «GitHub Actions», затем переменная репозитория PAGES_ENABLED = 1.
# Ограничения GitHub Pages: свои HTTP-заголовки задать нельзя (файл _headers игнорируется), все файлы
# кэшируются на 10 минут — новая версия PWA доходит до телефонов до 10 минут позже, чем на Cloudflare Pages.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          REPO: ${{ github.event.repository.name }}
          VITE_SUPABASE_URL: ${{ (vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF) != '' && format('https://{0}.supabase.co', (vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF)) || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ (vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY) }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}
        run: |
          VITE_BASE="/$REPO/cabinet/" npm run build -w @bills/cloud-web
          VITE_BASE="/$REPO/demo/" VITE_DEMO_LOCAL=1 npm run build -w @bills/web
          VITE_BASE="/$REPO/kofe/" VITE_DEMO_LOCAL=1 VITE_TRIAL=1 npm run build -w @bills/web -- --outDir dist-trial
          mkdir -p _site
          cp -r apps/cloud-web/dist _site/cabinet
          cp -r apps/web/dist _site/demo
          cp -r apps/web/dist-trial _site/kofe
          rm -f _site/*/_headers _site/*/_redirects
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>TS</title>
          <style>body{font:16px system-ui,sans-serif;background:#0e1311;color:#e8efe9;display:grid;place-items:center;min-height:100vh;margin:0}
          a{display:block;margin:12px 0;padding:14px 18px;border-radius:12px;background:#1b2621;color:#e8efe9;text-decoration:none}</style>
          </head><body><main><h1>TS</h1>
          <a href="cabinet/">Кабинет владельца</a>
          <a href="demo/">Демо экрана клуба — данные сбрасываются каждую ночь</a>
          <a href="kofe/">Пробная версия для кофейни — 14 дней, данные ваши</a>
          </main></body></html>
          HTML
          touch _site/.nojekyll

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
